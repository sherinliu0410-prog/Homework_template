<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cake Memo</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family:
          -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
        color: #71544b;
        background: #e4eadf;
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
      }
      button {
        min-height: 44px;
        cursor: pointer;
      }
      #canvasWrap {
        position: fixed;
        z-index: 0;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #canvasWrap canvas {
        display: block;
        touch-action: none;
      }
      #interactionHint {
        position: fixed;
        z-index: 15;
        top: 22px;
        left: 24px;
        display: flex;
        align-items: flex-start;
        gap: 10px;
        width: min(490px, calc(100vw - 112px));
        padding: 12px 16px;
        border: 1px solid rgba(212, 193, 177, 0.48);
        border-radius: 15px;
        background: rgba(250, 248, 241, 0.94);
        box-shadow: 0 5px 20px rgba(90, 63, 50, 0.08);
        color: #71544b;
        font-size: 13px;
        line-height: 1.5;
        pointer-events: none;
      }
      #interactionHint[hidden] {
        display: none;
      }
      #interactionHint strong {
        flex: 0 0 auto;
        color: #b57d83;
        font-size: 12px;
        font-weight: 650;
      }
      #interactionHintText {
        min-width: 0;
      }
      .memo-filters {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 12px;
      }
      .memo-filters input {
        grid-column: 1 / -1;
      }
      #memoSearch {
        cursor: text;
        caret-color: #71544b;
        -webkit-appearance: none;
        appearance: none;
      }
      #memoSearch:focus {
        box-shadow: 0 0 0 2px rgba(214, 168, 181, 0.28);
      }
      .memo-filters input,
      .memo-filters select {
        min-width: 0;
        padding: 9px 10px;
        font-size: 12px;
      }
      #menuButton {
        position: fixed;
        z-index: 50;
        top: 20px;
        right: 22px;
        width: 48px;
        height: 48px;
        padding: 11px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 6px;
        border: 0;
        border-radius: 50%;
        background: rgba(248, 248, 241, 0.94);
        box-shadow: 0 3px 15px rgba(90, 63, 50, 0.08);
      }
      #menuButton span {
        display: block;
        width: 22px;
        height: 2px;
        border-radius: 5px;
        background: #71544b;
      }
      #overlay {
        position: fixed;
        z-index: 30;
        inset: 0;
        background: rgba(80, 59, 50, 0.2);
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition:
          opacity 0.25s,
          visibility 0.25s;
      }
      #overlay.open {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }
      #menuPanel {
        position: fixed;
        z-index: 1000;
        isolation: isolate;
        pointer-events: none;
        top: 0;
        right: 0;
        width: min(430px, 100%);
        height: 100%;
        padding: 28px 25px 35px;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        background: #f8f8f1;
        box-shadow: -8px 0 35px rgba(90, 63, 50, 0.08);
        transform: translateX(105%);
        transition: transform 0.28s ease;
      }
      #menuPanel.open {
        transform: translateX(0);
        pointer-events: auto;
      }
      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 24px;
      }
      .panel-header h2 {
        margin: 0;
        font-size: 22px;
        font-weight: 600;
      }
      .closeButton,
      .primaryButton,
      .secondaryButton,
      .smallButton {
        border: 0;
        border-radius: 12px;
        padding: 11px 15px;
      }
      .closeButton {
        width: 44px;
        min-width: 44px;
        height: 44px;
        padding: 0;
        border-radius: 50%;
        background: #eee8e1;
        color: #71544b;
        font-size: 22px;
      }
      .primaryButton {
        background: #d9a7b5;
        color: white;
      }
      .secondaryButton,
      .smallButton {
        background: #eee8e1;
        color: #71544b;
      }
      .smallButton {
        min-width: 60px;
        padding: 9px 12px;
        font-size: 12px;
      }
      .fullWidth {
        width: 100%;
      }
      .hidden {
        display: none !important;
      }
      .section {
        margin-bottom: 25px;
      }
      .section-title {
        margin: 0 0 12px;
        font-size: 13px;
        font-weight: 600;
        color: #9a756d;
        letter-spacing: 0.08em;
      }
      input,
      textarea,
      select {
        position: relative;
        z-index: 1;
        pointer-events: auto;
        min-height: 44px;
        width: 100%;
        padding: 11px 12px;
        border: 1px solid #e3ddd6;
        border-radius: 11px;
        outline: none;
        color: #66534e;
        background: #fffdfb;
        touch-action: manipulation;
        -webkit-user-select: text;
        user-select: text;
      }
      input:focus,
      textarea:focus,
      select:focus {
        border-color: #d6a8b5;
      }
      textarea {
        min-height: 95px;
        resize: vertical;
        line-height: 1.6;
      }
      /* Keep controls directly interactive above the canvas and dimming overlay. */
      #menuPanel form,
      #menuPanel .memo-filters {
        position: relative;
        z-index: 1;
        pointer-events: auto;
      }
      #menuPanel button,
      #menuPanel input,
      #menuPanel textarea,
      #menuPanel select {
        pointer-events: auto;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      .select-control {
        position: relative;
        min-width: 0;
        z-index: 5;
      }
      .select-control.open {
        z-index: 20;
      }
      .select-trigger {
        display: flex;
        width: 100%;
        min-height: 48px;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 11px 14px;
        border: 1px solid #e3ddd6;
        border-radius: 11px;
        color: #66534e;
        background: #fffdfb;
        text-align: left;
        touch-action: manipulation;
      }
      .select-trigger:focus-visible,
      .select-option:focus-visible {
        outline: 3px solid rgba(214, 168, 181, 0.45);
        outline-offset: 2px;
      }
      .select-chevron {
        flex: 0 0 auto;
        color: #92786d;
        font-size: 13px;
      }
      .select-options {
        position: relative;
        display: none;
        max-height: min(230px, 38vh);
        overflow-y: auto;
        margin-top: 6px;
        padding: 6px;
        border: 1px solid #e8e1db;
        border-radius: 12px;
        background: #fffdfb;
        box-shadow: 0 10px 28px rgba(80, 63, 50, 0.16);
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
      }
      .select-control.open .select-options {
        display: block;
      }
      .select-option {
        display: block;
        width: 100%;
        min-height: 44px;
        padding: 10px 12px;
        border: 0;
        border-radius: 8px;
        color: #66534e;
        background: transparent;
        text-align: left;
        touch-action: manipulation;
      }
      .select-option[aria-selected="true"] {
        background: #f5e7e9;
        color: #805e62;
        font-weight: 600;
      }
      .native-select-source {
        position: absolute !important;
        width: 1px !important;
        height: 1px !important;
        min-height: 1px !important;
        padding: 0 !important;
        overflow: hidden !important;
        clip: rect(0, 0, 0, 0) !important;
        clip-path: inset(50%) !important;
        white-space: nowrap !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
      .field {
        margin-bottom: 13px;
      }
      .field label {
        display: block;
        margin-bottom: 6px;
        font-size: 12px;
        color: #92786d;
      }
      .form-actions {
        display: flex;
        gap: 9px;
        margin-top: 17px;
      }
      .form-actions button {
        flex: 1;
      }
      #detailModal .form-actions {
        flex-wrap: wrap;
      }
      #detailModal .form-actions button {
        flex: 1 1 calc(50% - 9px);
      }
      #detailEdit {
        background: #d9a7b5;
        color: #fff;
      }
      #detailArchive {
        background: #f0d5ce;
        color: #89564d;
      }
      #detailArchive:hover {
        background: #e8c0b6;
      }
      #detailClose {
        background: #eee8e1;
        color: #71544b;
      }
      #detailClose:hover {
        background: #e3d8ce;
      }
      .actions-row {
        display: flex;
        gap: 9px;
      }
      .actions-row button {
        flex: 1;
      }
      #memoListSection {
        display: none;
      }
      #memoListSection.visible {
        display: block;
      }
      #memoListSection.restore-mode .memo-filters {
        display: none;
      }
      .memo-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 13px;
      }
      .memo-item {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 13px;
        border: 1px solid #e8e1db;
        border-radius: 13px;
        background: #fffdfb;
      }
      .memo-check {
        display: flex;
        flex: 0 0 44px;
        align-items: center;
        justify-content: center;
        width: 44px;
        min-height: 44px;
        margin: -7px 0 0 -7px;
        cursor: pointer;
        touch-action: manipulation;
      }
      .memo-check input {
        min-height: 22px;
        width: 22px;
        min-width: 22px;
        height: 22px;
        margin: 0;
        padding: 0;
        accent-color: #bd8799;
        cursor: pointer;
      }
      .memo-color {
        width: 15px;
        height: 15px;
        flex: 0 0 15px;
        margin-top: 3px;
        border-radius: 50%;
      }
      .memo-info {
        flex: 1;
        min-width: 0;
      }
      .memo-info strong {
        display: block;
        overflow-wrap: anywhere;
        font-size: 13px;
      }
      .memo-info p {
        margin: 5px 0 0;
        color: #a08a80;
        font-size: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .memo-meta {
        margin-top: 6px;
        color: #a08a80;
        font-size: 11px;
      }
      .memo-date {
        margin-top: 6px;
        color: #92786d;
        font-size: 11px;
        line-height: 1.45;
      }
      #detailSchedule {
        font-size: 13px;
      }
      .memo-status-tag {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        margin-top: 7px;
        padding: 4px 8px;
        border-radius: 999px;
        background: #f4e1e6;
        color: #956879;
        font-size: 11px;
        font-weight: 700;
      }
      #detailCompletionTag {
        display: none;
        width: fit-content;
        margin: 12px 0 0;
      }
      #detailCompletionTag.visible {
        display: inline-flex;
      }
      .memo-actions {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .emptyState {
        padding: 20px 10px;
        color: #a08a80;
        font-size: 12px;
        text-align: center;
        line-height: 1.8;
      }
      #detailModal {
        position: fixed;
        z-index: 60;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: rgba(80, 59, 50, 0.25);
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 0.2s,
          visibility 0.2s;
      }
      #detailModal.open {
        opacity: 1;
        visibility: visible;
      }
      #detailModal.sliceDetail {
        align-items: flex-start;
        justify-content: flex-start;
        padding: 0;
        background: transparent;
        pointer-events: auto;
      }
      #detailModal.sliceDetail .detail-card {
        position: fixed;
        pointer-events: auto;
        transition:
          left 0.25s ease,
          top 0.25s ease;
      }
      .detail-card {
        width: min(390px, 100%);
        max-height: 85vh;
        overflow-y: auto;
        padding: 24px;
        border-radius: 22px;
        background: #f8f8f1;
        box-shadow: 0 15px 60px rgba(80, 63, 50, 0.15);
      }
      .detail-color {
        width: 34px;
        height: 34px;
        margin-bottom: 17px;
        border-radius: 11px;
      }
      .detail-card h3 {
        margin: 0 0 10px;
        font-size: 21px;
        overflow-wrap: anywhere;
      }
      #detailBody {
        margin: 0;
        color: #92786d;
        font-size: 14px;
        line-height: 1.8;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      #detailMeta {
        margin-top: 18px;
        color: #a08a80;
        font-size: 12px;
      }
      @media (max-width: 520px) {
        #menuButton {
          top: 13px;
          right: 13px;
        }
        #interactionHint {
          top: 72px;
          left: 12px;
          width: calc(100vw - 24px);
          padding: 10px 12px;
          font-size: 12px;
        }
        #menuPanel {
          padding: 24px 18px;
        }
      }
    </style>
  </head>
  <body>
    <div id="canvasWrap"></div>
    <div id="interactionHint" role="status" aria-live="polite">
      <strong>QUICK GUIDE</strong>
      <span id="interactionHintText">1. Create a memo from the menu.</span>
    </div>
    <button
      id="menuButton"
      aria-label="Open menu: create, browse, or restore memos"
      title="Create, browse, or restore memos"
      aria-expanded="false"
    >
      <span></span><span></span><span></span>
    </button>
    <div id="overlay"></div>
    <aside id="menuPanel" aria-hidden="true">
      <div class="panel-header">
        <h2>Cake Memo</h2>
        <button id="menuClose" class="closeButton" aria-label="Close menu">
          ×
        </button>
      </div>

      <div class="section actions-row">
        <button id="newMemoButton" class="primaryButton fullWidth">
          Write Memo
        </button>
        <button id="browseMemosButton" class="secondaryButton fullWidth">
          Browse
        </button>
        <button id="restoreMemoButton" class="secondaryButton fullWidth">
          Restore Memo
        </button>
      </div>

      <section id="memoFormSection" class="section hidden">
        <h3 id="formHeading" class="section-title">NEW MEMO</h3>
        <form id="memoForm">
          <input type="hidden" id="memoId" />
          <input type="hidden" id="memoType" value="memory" />

          <div class="field">
            <label for="memoTitle">Title</label>
            <input
              id="memoTitle"
              type="text"
              maxlength="100"
              placeholder="What is this memo about?"
              required
            />
          </div>

          <div class="field">
            <label for="memoBody">Content</label>
            <textarea
              id="memoBody"
              maxlength="3000"
              placeholder="Add more details…"
            ></textarea>
          </div>

          <div class="field">
            <label for="memoScheduledAt">Date &amp; time (optional)</label>
            <input id="memoScheduledAt" type="datetime-local" />
          </div>

          <div class="field">
            <label for="memoCategory">Category</label>
            <div class="select-control" data-select-control="memoCategory">
              <button
                type="button"
                class="select-trigger"
                aria-haspopup="listbox"
                aria-expanded="false"
              >
                <span class="select-value"></span>
                <span class="select-chevron" aria-hidden="true">▾</span>
              </button>
              <div class="select-options" role="listbox"></div>
            </div>
            <select
              id="memoCategory"
              class="native-select-source"
              aria-hidden="true"
              tabindex="-1"
            ></select>
          </div>

          <div class="field">
            <label for="memoImportance">Importance</label>
            <div class="select-control" data-select-control="memoImportance">
              <button
                type="button"
                class="select-trigger"
                aria-haspopup="listbox"
                aria-expanded="false"
              >
                <span class="select-value"></span>
                <span class="select-chevron" aria-hidden="true">▾</span>
              </button>
              <div class="select-options" role="listbox"></div>
            </div>
            <select
              id="memoImportance"
              class="native-select-source"
              aria-hidden="true"
              tabindex="-1"
            >
              <option value="1">Low</option>
              <option value="2" selected>Medium</option>
              <option value="3">High</option>
            </select>
          </div>

          <div class="form-actions">
            <button type="submit" class="primaryButton">Save Memo</button>
            <button type="button" id="cancelForm" class="secondaryButton">
              Cancel
            </button>
          </div>
        </form>
      </section>

      <section id="memoListSection" class="section">
        <h3 class="section-title">RESTORE MEMO</h3>
        <div class="memo-filters">
          <input
            id="memoSearch"
            type="search"
            placeholder="Search memos…"
            aria-label="Search memos"
            inputmode="search"
            enterkeyhint="search"
            autocomplete="off"
          />
          <div class="select-control" data-select-control="memoStatusFilter">
            <button
              type="button"
              class="select-trigger"
              aria-label="Filter memos by status"
              aria-haspopup="listbox"
              aria-expanded="false"
            >
              <span class="select-value"></span>
              <span class="select-chevron" aria-hidden="true">▾</span>
            </button>
            <div class="select-options" role="listbox"></div>
            <select
              id="memoStatusFilter"
              class="native-select-source"
              aria-hidden="true"
              tabindex="-1"
            >
              <option value="all">All statuses</option>
              <option value="pending">Pending</option>
              <option value="completed">Completed</option>
              <option value="high">High importance</option>
            </select>
          </div>
          <div class="select-control" data-select-control="memoCategoryFilter">
            <button
              type="button"
              class="select-trigger"
              aria-label="Filter memos by category"
              aria-haspopup="listbox"
              aria-expanded="false"
            >
              <span class="select-value"></span>
              <span class="select-chevron" aria-hidden="true">▾</span>
            </button>
            <div class="select-options" role="listbox"></div>
            <select
              id="memoCategoryFilter"
              class="native-select-source"
              aria-hidden="true"
              tabindex="-1"
            >
              <option value="all">All categories</option>
            </select>
          </div>
        </div>
        <div id="memoList" class="memo-list"></div>
      </section>
    </aside>

    <div id="detailModal">
      <article class="detail-card">
        <div id="detailColor" class="detail-color"></div>
        <h3 id="detailTitle"></h3>
        <p id="detailBody"></p>
        <div id="detailMeta"></div>
        <div id="detailSchedule" class="memo-date"></div>
        <div id="detailCompletionTag" class="memo-status-tag">✓ Completed</div>
        <div class="form-actions">
          <button id="detailEdit" class="primaryButton">Edit</button>
          <button id="detailArchive" class="secondaryButton">Delete</button>
          <button id="detailClose" class="secondaryButton">Close</button>
        </div>
      </article>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
    <script src="./sketch.js"></script>
  </body>
</html>
