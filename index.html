<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>과제 모음</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
    }

    #menu {
      position: fixed;
      left: 0;
      top: 0;
      width: 150px;
      height: 100vh;
      padding: 20px;
      box-sizing: border-box;
      background: white;
    }

    .menu-item {
      margin-bottom: 12px;
      color: blue;
      cursor: pointer;
    }

    #levels {
      display: none;
      margin-left: 15px;
      margin-bottom: 12px;
    }

    #levels div {
      margin-bottom: 8px;
      color: blue;
      cursor: pointer;
    }

    #viewer {
      position: fixed;
      left: 150px;
      top: 0;
      width: calc(100% - 150px);
      height: 100%;
      border: none;
    }
  </style>
</head>

<body>

  <div id="menu">

    <div
      class="menu-item"
      onclick="openPage('Homework1/index.html')"
    >
      Homework1
    </div>

    <div
      class="menu-item"
      onclick="toggleLevels()"
    >
      Homework2
    </div>

    <div id="levels">

      <div
        onclick="openPage('Homework2/Level1/index.html')"
      >
        Level1
      </div>

      <div
        onclick="openPage('Homework2/Level2/index.html')"
      >
        Level2
      </div>

      <div
        onclick="openPage('Homework2/Level3/index.html')"
      >
        Level3
      </div>

    </div>

    <div
      class="menu-item"
      onclick="openPage('Homework3/index.html')"
    >
      Homework3
    </div>

  </div>


  <iframe id="viewer"></iframe>


  <script>

    // 网站打开时，默认加载 Homework1
    window.addEventListener("load", function () {
      document.getElementById("viewer").src =
        "Homework1/index.html?v=2";
    });


    function openPage(path) {
      document.getElementById("viewer").src =
        path;
    }


    function toggleLevels() {

      const levels =
        document.getElementById("levels");

      if (levels.style.display === "block") {

        levels.style.display = "none";

      } else {

        levels.style.display = "block";

      }
    }

  </script>

</body>
</html>
